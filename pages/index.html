<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lofidoro</title>
    <link rel="icon" type="image/png" href="/img/tomato.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../timer.js"></script>
</head>
<body>
    <header class="header-bar">
        <div class="brand">
            <img src="/img/tomato.png" class="logo" alt="Lofidoro logo">
            <div class="brand-copy">
                <h1 class="title">Lofidoro</h1>
                <p class="subtitle">Focus timer + study streams</p>
            </div>
        </div>

        <button class="settings-toggle" type="button" aria-label="Open settings">
            <svg class="gear rotate" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M10.35 3.84a1 1 0 0 1 .98-.84h1.34a1 1 0 0 1 .98.84l.23 1.37a7.99 7.99 0 0 1 1.6.66l1.16-.76a1 1 0 0 1 1.28.13l.95.95a1 1 0 0 1 .13 1.28l-.76 1.16c.26.51.48 1.04.66 1.6l1.37.23a1 1 0 0 1 .84.98v1.34a1 1 0 0 1-.84.98l-1.37.23a8.06 8.06 0 0 1-.66 1.6l.76 1.16a1 1 0 0 1-.13 1.28l-.95.95a1 1 0 0 1-1.28.13l-1.16-.76a8.06 8.06 0 0 1-1.6.66l-.23 1.37a1 1 0 0 1-.98.84h-1.34a1 1 0 0 1-.98-.84l-.23-1.37a8.06 8.06 0 0 1-1.6-.66l-1.16.76a1 1 0 0 1-1.28-.13l-.95-.95a1 1 0 0 1-.13-1.28l.76-1.16a8.06 8.06 0 0 1-.66-1.6l-1.37-.23a1 1 0 0 1-.84-.98v-1.34a1 1 0 0 1 .84-.98l1.37-.23a8.06 8.06 0 0 1 .66-1.6l-.76-1.16a1 1 0 0 1 .13-1.28l.95-.95a1 1 0 0 1 1.28-.13l1.16.76a7.99 7.99 0 0 1 1.6-.66l.23-1.37Z"/>
                <circle cx="12" cy="12" r="2.75"/>
            </svg>
        </button>
    </header>

    <section class="settings">
        <div class="settings-content">
            <h2 class="settings-title">Session Settings</h2>

            <div class="setting-row">
                <label class="setting-label" for="work-length">Work length</label>
                <div class="setting-input-group">
                    <input class="setting-input" id="work-length" name="work-length" type="number" value="25">
                    <span class="setting-unit">min</span>
                </div>
            </div>

            <div class="setting-row">
                <label class="setting-label" for="break-length">Break length</label>
                <div class="setting-input-group">
                    <input class="setting-input" id="break-length" name="break-length" type="number" value="5">
                    <span class="setting-unit">min</span>
                </div>
            </div>

            <div class="setting-row">
                <label class="setting-label" for="music-source">Music</label>
                <select class="setting-select" id="music-source" name="music-source">
                    <option value="jfKfPfyJRdk">Lofi Girl - Relax / Study</option>
                    <option value="4xDzrJKXOOY">Lofi Girl - Synthwave</option>
                    <option value="5yx6BWlEVcY">Chillhop Radio - Beats</option>
                    <option value="DWcJFNfaw9c">Chill Music Lab - Ambient Focus</option>
                </select>
            </div>

            <hr id="hor-line">

            <div class="enable-container">
                <div class="flexbox">
                    <label class="switch-label" for="enable-notifs">Enable notifications</label>
                    <input class="form-check-input" type="checkbox" role="switch" id="enable-notifs" checked>
                </div>

                <div class="flexbox">
                    <label class="switch-label" for="enable-alarms">Enable alarm rings</label>
                    <input class="form-check-input" type="checkbox" role="switch" id="enable-alarms" checked>
                </div>

                <div class="flexbox">
                    <label class="switch-label" for="dark-mode">Dark mode</label>
                    <input class="form-check-input" type="checkbox" role="switch" id="dark-mode">
                </div>

                <div class="flexbox">
                    <label class="switch-label" for="zen-mode">Zen mode</label>
                    <input class="form-check-input" type="checkbox" role="switch" id="zen-mode">
                </div>
            </div>

            <div class="settings-actions">
                <button id="save-button" class="save-button" type="button">Save Changes</button>
                <button id="reset-session-button" class="secondary-button" type="button">Reset Session</button>
            </div>
        </div>
    </section>

    <main class="content-shell">
        <div class="video-wrap">
            <iframe class="lofi-vid" width="397" height="226" src="https://www.youtube.com/embed/jfKfPfyJRdk?rel=0"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>

        <section class="bottom-bar">
            <div class="bottom-flex">
                <div class="time-rect">
                    <div class="time-display"></div>
                    <div class="progress-bar"></div>
                </div>

                <button class="pause-button" type="button" aria-label="Pause">
                    <span class="button-icon" aria-hidden="true"></span>
                </button>
            </div>

            <div class="pomodoros-completed"></div>
        </section>
    </main>
</body>
</html>
